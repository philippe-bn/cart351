<!-- will be a child of base-->
{% extends "base.html" %}

{% block content %}

<section class = "t2-collect">

<div class= "formContainer">
<form id = "insertT2Data" action = "/getSearchCriteria_adv">
<h3> NASA </h3>
<fieldset>
    <p>
        <label>NASA API SEARCH CRITERIA:</label>
        <input type="text" placeholder="Search for..." size="24" maxlength = "40" name = "input_text" required>
    </p>
    <p>
        <label></label>
        <input id = "submitT2" type = "submit" name = "submit" value = "Launch search!" id =buttonS />
    </p>
</fieldset>
</form>
</div>

<div class="formDisplayContainer">
{% for singleImage in images %}
    <p>
        {{description}}
    </p>
    <img src = {{singleImage}} />
{% endfor %}
</div>
</section>

{% endblock %}
